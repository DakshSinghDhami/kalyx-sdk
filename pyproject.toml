[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalyx-sdk"
version = "0.1.0"
description = "Python SDK for the KALYX protocol: pay-per-citation context retrieval for autonomous AI agents over HTTP 402 on Solana devnet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daksh Singh Dhami", email = "dakshsinghdhami@gmail.com" }]
keywords = ["solana", "ai-agents", "http-402", "micropayments", "langchain", "llamaindex", "escrow"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
    "solders>=0.26,<1.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.12"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.11",
    "build>=1.2",
    "pip-audit>=2.7",
    "langchain-core>=0.3",
    "llama-index-core>=0.12",
]

[project.urls]
Homepage = "https://kalyxprotocol.xyz"
Repository = "https://github.com/DakshSinghDhami/kalyx-sdk"
Documentation = "https://github.com/DakshSinghDhami/kalyx-sdk/tree/main/docs"
Issues = "https://github.com/DakshSinghDhami/kalyx-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kalyx_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/kalyx_sdk", "tests", "idl", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
markers = [
    "slow: opt-in integration tests against a live gateway (deselected unless KALYX_LIVE_TESTS=1)",
]

[tool.coverage.run]
source = ["src/kalyx_sdk"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # bandit
    "ASYNC",
    "RUF",
]
ignore = [
    "S101",  # asserts are expected in tests and used for internal invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S311", "SLF001"]
"examples/**" = ["S104", "T201"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["kalyx_sdk"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["langchain_core.*", "llama_index.*"]
ignore_missing_imports = true
